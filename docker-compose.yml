services:
  static-host:
    build: .
    container_name: static-host-platform
    ports:
      - "3000:3000"
    volumes:
      # 持久化存储网站文件
      - ./sites:/app/sites
      # 持久化数据库
      - ./database:/app/database
      # 临时上传目录
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_FILE_SIZE=52428800
      - DB_PATH=/app/database/platform.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting the service}
      - COOKIE_SECURE=false
    restart: unless-stopped
    networks:
      - static-host-network

networks:
  static-host-network:
    driver: bridge
