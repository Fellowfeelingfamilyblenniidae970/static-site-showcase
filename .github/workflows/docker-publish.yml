name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag version without the v prefix
        required: true
        default: 1.3.0

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: epiphany131/static-site-showcase

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "Docker releases must run from a vX.Y.Z Git tag." >&2
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package.json $package_version." >&2
            exit 1
          fi
          tagged_commit="$(git rev-parse "refs/tags/v${version}^{commit}")"
          if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked-out commit does not match tag v${version}." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "revision=$tagged_commit"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "minor=$minor"
            echo "major=$major"
            if [[ "$version" == *-* ]]; then
              echo "stable=false"
            else
              echo "stable=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and deployment assets
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          bash -n deploy.sh
          sha256sum --strict --check deploy-assets.sha256

      - name: Run tests and dependency audit
        run: |
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.stable }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build amd64 smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: static-site-showcase:smoke
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            BUILD_REVISION=${{ steps.release.outputs.revision }}
            BUILD_CREATED=${{ steps.release.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/showcase-smoke"/{database,sites,uploads}
          docker run -d --name static-site-showcase-smoke \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=smoke-test-password-123456789 \
            -v "$RUNNER_TEMP/showcase-smoke/database:/app/database" \
            -v "$RUNNER_TEMP/showcase-smoke/sites:/app/sites" \
            -v "$RUNNER_TEMP/showcase-smoke/uploads:/app/uploads" \
            static-site-showcase:smoke
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' static-site-showcase-smoke)"
            if [[ "$status" == healthy ]]; then break; fi
            if [[ "$status" == unhealthy || "$status" == exited || "$attempt" == 60 ]]; then
              docker logs static-site-showcase-smoke
              exit 1
            fi
            sleep 2
          done
          docker exec static-site-showcase-smoke sh -lc \
            'test -f /app/THIRD_PARTY_NOTICES.md && test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/test && test ! -e /app/docs'
          docker stop static-site-showcase-smoke
          docker rm static-site-showcase-smoke
          docker run --rm \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=smoke-test-password-123456789 \
            -v "$RUNNER_TEMP/showcase-smoke/database:/app/database" \
            -v "$RUNNER_TEMP/showcase-smoke/sites:/app/sites" \
            -v "$RUNNER_TEMP/showcase-smoke/uploads:/app/uploads" \
            static-site-showcase:smoke node -e \
            "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/app/database/platform.db');if(!db.prepare('SELECT 1 FROM users LIMIT 1').get())process.exit(1);db.close()"

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker Hub release target
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ "$DOCKERHUB_USERNAME" != epiphany131 ]]; then
            echo 'DOCKERHUB_USERNAME must be epiphany131.' >&2
            exit 1
          fi
          if docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.release.outputs.version }}" >/dev/null 2>&1; then
            echo 'The exact Docker image tag already exists and will not be overwritten.' >&2
            exit 1
          fi

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            BUILD_REVISION=${{ steps.release.outputs.revision }}
            BUILD_CREATED=${{ steps.release.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect --raw "${IMAGE_NAME}:${{ steps.release.outputs.version }}")"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' <<< "$manifest"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' <<< "$manifest"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f static-site-showcase-smoke >/dev/null 2>&1 || true
